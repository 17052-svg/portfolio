<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Thanachot</title>


    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet">


    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080808;
            color: #ffffff;
            font-family: 'Kanit', sans-serif;
            overflow-x: hidden;
        }


        /* =========================
           BACKGROUND EFFECTS
        ========================= */

        .wave {
            position: fixed;
            left: -20%;
            width: 140%;
            height: 300px;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.25;
        }

        .wave1 {
            top: 25%;
            border-top: 2px solid #e50914;

            box-shadow:
                0 -20px 0 rgba(229, 9, 20, 0.15),
                0 -40px 0 rgba(229, 9, 20, 0.08);

            animation: waveMove 8s ease-in-out infinite alternate;
        }

        .wave2 {
            top: 55%;
            border-top: 1px solid #ff1a25;
            opacity: 0.15;

            animation: waveMoveReverse 10s ease-in-out infinite alternate;
        }

        .red-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            top: 20%;
            right: -200px;

            background: #e50914;
            filter: blur(180px);
            opacity: 0.08;

            pointer-events: none;
            z-index: -2;
        }


        /* =========================
           BACKGROUND ANIMATION
        ========================= */

        @keyframes waveMove {

            0% {
                transform: translateX(-5%) rotate(-3deg);
            }

            50% {
                transform: translateX(5%) rotate(3deg);
            }

            100% {
                transform: translateX(-3%) rotate(-2deg);
            }

        }

        @keyframes waveMoveReverse {

            0% {
                transform: translateX(5%) rotate(3deg);
            }

            50% {
                transform: translateX(-5%) rotate(-3deg);
            }

            100% {
                transform: translateX(3%) rotate(2deg);
            }

        }


        /* =========================
           NAVBAR
        ========================= */

        header {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 25px 7%;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            letter-spacing: 3px;
        }

        .logo span {
            color: #e50914;
        }

        .menu {
            display: flex;
            gap: 28px;
        }

        .menu a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .menu a:hover,
        .menu a.active {
            color: #e50914;
        }


        /* =========================
           PAGE TITLE
        ========================= */

        .page-title {
            text-align: center;
            margin-bottom: 80px;
        }

        .page-title p {
            color: #e50914;
            letter-spacing: 5px;
            font-size: 13px;
        }

        .page-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(40px, 6vw, 75px);
            letter-spacing: 5px;
            margin-top: 15px;
        }

        .page-title h1 span {
            color: transparent;
            -webkit-text-stroke: 1px #e50914;
        }


        /* =========================
           CONTACT PAGE
        ========================= */

        .contact-page {
            min-height: 800px;
            padding: 80px 8%;
        }

        .contact-container {
            max-width: 1000px;
            margin: auto;

            display: grid;
            grid-template-columns: 0.8fr 1.2fr;

            gap: 80px;
            align-items: center;
        }


        /* =========================
           CONTACT INTRO
        ========================= */

        .contact-intro {
            text-align: left;
        }

        .contact-label {
            color: #e50914;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 3px;
            font-size: 12px;
        }

        .contact-intro h2 {
            font-size: 42px;
            margin-top: 20px;
        }

        .contact-intro h2 span {
            display: block;
            color: #e50914;
        }

        .contact-intro > p:last-child {
            color: #999;
            line-height: 1.8;
            margin-top: 20px;
            font-size: 17px;
        }


        /* =========================
           CONTACT LIST
        ========================= */

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }


        /* =========================
           CONTACT CARD
        ========================= */

        .contact-card {
            display: flex;
            align-items: center;
            gap: 25px;

            padding: 25px;

            background: #111;
            border: 1px solid #292929;

            color: white;
            text-decoration: none;

            transition: 0.4s;
        }

        .contact-card:hover {
            transform: translateX(10px);
            border-color: #e50914;

            box-shadow:
                0 0 25px rgba(229, 9, 20, 0.2);
        }

        .contact-icon {
            width: 55px;
            height: 55px;

            display: flex;
            justify-content: center;
            align-items: center;

            border: 1px solid #e50914;
            color: #e50914;

            font-family: 'Orbitron', sans-serif;
            font-size: 12px;

            flex-shrink: 0;
        }

        .contact-card span {
            color: #e50914;

            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .contact-card h3 {
            margin-top: 8px;
            font-size: 20px;
            font-weight: 500;
        }

        .contact-card b {
            margin-left: auto;
            color: #e50914;
            font-size: 24px;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            padding: 30px;
            text-align: center;

            color: #666;
            border-top: 1px solid #222;

            font-size: 13px;
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 900px) {

            .menu {
                gap: 12px;
            }

            .menu a {
                font-size: 11px;
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            header {
                padding: 20px;
            }

            nav {
                flex-direction: column;
                gap: 20px;
            }

            .menu {
                flex-wrap: wrap;
                justify-content: center;
            }

            .contact-page {
                padding: 60px 20px;
            }

            .contact-container {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .contact-intro {
                text-align: center;
            }

            .contact-intro h2 {
                font-size: 34px;
            }

        }

    </style>

</head>

    <footer>

</body>
