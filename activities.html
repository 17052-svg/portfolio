<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>กิจกรรมและผลงาน | Thanachot Portfolio</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<section class="activities">


<h1>❤️ กิจกรรมและผลงาน</h1>


<div class="activity-container">



    <div class="activity-card">

        <img src="images/activities/activity1.jpg" 
        alt="กิจกรรมจิตอาสา">

        <h2>กิจกรรมจิตอาสา</h2>

        <p>
        เข้าร่วมช่วยเหลืองานมูลนิธิต่าง ๆ 
        และช่วยเหลือสังคม
        </p>

    </div>




    <div class="activity-card">

        <img src="images/activities/activity2.jpg" 
        alt="ช่วยเหลือโรงเรียน">

        <h2>ช่วยเหลือพื้นที่ขาดแคลน</h2>

        <p>
        ร่วมช่วยงานโรงเรียนและพื้นที่
        ที่ต้องการความช่วยเหลือ
        </p>

    </div>





    <div class="activity-card">

        <img src="images/activities/activity3.jpg" 
        alt="ช่วยงาน">

        <h2>ช่วยเหลือคนรอบข้าง</h2>

        <p>
        ช่วยเหลือเพื่อน ครู 
        และคนรอบข้างอยู่เสมอ
        </p>

    </div>





    <div class="activity-card">

        <img src="images/activities/activity4.jpg" 
        alt="วาดรูป">

        <h2>งานอดิเรก</h2>

        <p>
        ชื่นชอบการวาดรูป
        และสร้างสรรค์ผลงานศิลปะ
        </p>

    </div>



</div>


</section>


</body>

</html>
