<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skills | Thanachot</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet">


    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080808;
            color: #ffffff;
            font-family: 'Kanit', sans-serif;
            overflow-x: hidden;
        }


        /* =========================
           BACKGROUND EFFECTS
        ========================= */

        .wave {
            position: fixed;
            left: -20%;
            width: 140%;
            height: 300px;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.25;
        }

        .wave1 {
            top: 25%;
            border-top: 2px solid #e50914;

            box-shadow:
                0 -20px 0 rgba(229, 9, 20, 0.15),
                0 -40px 0 rgba(229, 9, 20, 0.08);

            animation: waveMove 8s ease-in-out infinite alternate;
        }

        .wave2 {
            top: 55%;
            border-top: 1px solid #ff1a25;
            opacity: 0.15;

            animation: waveMoveReverse 10s ease-in-out infinite alternate;
        }

        .red-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            top: 20%;
            right: -200px;

            background: #e50914;
            filter: blur(180px);
            opacity: 0.08;

            pointer-events: none;
            z-index: -2;
        }


        /* =========================
           BACKGROUND ANIMATION
        ========================= */

        @keyframes waveMove {

            0% {
                transform: translateX(-5%) rotate(-3deg);
            }

            50% {
                transform: translateX(5%) rotate(3deg);
            }

            100% {
                transform: translateX(-3%) rotate(-2deg);
            }

        }

        @keyframes waveMoveReverse {

            0% {
                transform: translateX(5%) rotate(3deg);
            }

            50% {
                transform: translateX(-5%) rotate(-3deg);
            }

            100% {
                transform: translateX(3%) rotate(2deg);
            }

        }


        /* =========================
           NAVBAR
        ========================= */

        header {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 25px 7%;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            letter-spacing: 3px;
        }

        .logo span {
            color: #e50914;
        }

        .menu {
            display: flex;
            gap: 28px;
        }

        .menu a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .menu a:hover,
        .menu a.active {
            color: #e50914;
        }


        /* =========================
           PAGE TITLE
        ========================= */

        .page-title {
            text-align: center;
            margin-bottom: 80px;
        }

        .page-title p {
            color: #e50914;
            letter-spacing: 5px;
            font-size: 13px;
        }

        .page-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(40px, 6vw, 75px);
            letter-spacing: 5px;
            margin-top: 15px;
        }

        .page-title h1 span {
            color: transparent;
            -webkit-text-stroke: 1px #e50914;
        }


        /* =========================
           SKILLS PAGE
        ========================= */

        .skills-page {
            min-height: 800px;
            padding: 80px 8%;
        }


        /* =========================
           SKILL CONTAINER
        ========================= */

        .skills-container {
            max-width: 900px;
            margin: auto;
            padding: 30px 0;
        }

        .skill-item {
            margin-bottom: 40px;
        }

        .skill-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .skill-title h2 {
            font-size: 20px;
            font-weight: 500;
        }

        .skill-title span {
            color: #e50914;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
        }


        /* =========================
           SKILL BAR
        ========================= */

        .skill-bar {
            width: 100%;
            height: 12px;
            background: #222;
            border: 1px solid #333;
            overflow: hidden;
        }

        .skill-progress {
            height: 100%;
            background: #e50914;
            box-shadow: 0 0 15px #e50914;

            animation: skillLoading 1.5s ease forwards;
            transform-origin: left;
        }

        .responsibility {
            width: 90%;
        }

        .teamwork {
            width: 85%;
        }

        .creativity {
            width: 88%;
        }

        .learning {
            width: 90%;
        }


        @keyframes skillLoading {

            from {
                transform: scaleX(0);
            }

            to {
                transform: scaleX(1);
            }

        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            padding: 30px;
            text-align: center;
            color: #666;
            border-top: 1px solid #222;
            font-size: 13px;
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 900px) {

            .menu {
                gap: 12px;
            }

            .menu a {
                font-size: 11px;
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding: 20px;
            }

            nav {
                flex-direction: column;
                gap: 20px;
            }

            .menu {
                flex-wrap: wrap;
                justify-content: center;
            }

            .skills-page {
                padding: 60px 20px;
            }

            .skill-title h2 {
                font-size: 17px;
            }

        }

    </style>

</head>


<body>


    <!-- BACKGROUND EFFECTS -->

    <div class="wave wave1"></div>

    <div class="wave wave2"></div>

    <div class="red-glow"></div>


    <!-- NAVIGATION -->

    <header>

        <nav>

            <h2 class="logo">
                DREAM<span>.</span>
            </h2>


            <div class="menu">

                <a href="index.html">
                    HOME
                </a>

                <a href="personal.html">
                    ABOUT
                </a>

                <a href="education.html">
                    EDUCATION
                </a>

                <a href="activities.html">
                    ACTIVITIES
                </a>

                <a href="skills.html" class="active">
                    SKILLS
                </a>

                <a href="contact.html">
                    CONTACT
                </a>

            </div>

        </nav>

    </header>


    <!-- SKILLS -->

    <main class="skills-page">


        <div class="page-title">

            <p>
                MY ABILITIES
            </p>


            <h1>
                MY
                <span>SKILLS</span>
            </h1>

        </div>


        <section class="skills-container">


            <!-- RESPONSIBILITY -->

            <div class="skill-item">

                <div class="skill-title">

                    <h2>
                        ความรับผิดชอบ
                    </h2>

                    <span>
                        90%
                    </span>

                </div>


                <div class="skill-bar">

                    <div class="skill-progress responsibility"></div>

                </div>

            </div>


            <!-- TEAMWORK -->

            <div class="skill-item">

                <div class="skill-title">

                    <h2>
                        การทำงานเป็นทีม
                    </h2>

                    <span>
                        85%
                    </span>

                </div>


                <div class="skill-bar">

                    <div class="skill-progress teamwork"></div>

                </div>

            </div>


            <!-- CREATIVITY -->

            <div class="skill-item">

                <div class="skill-title">

                    <h2>
                        ความคิดสร้างสรรค์
                    </h2>

                    <span>
                        88%
                    </span>

                </div>


                <div class="skill-bar">

                    <div class="skill-progress creativity"></div>

                </div>

            </div>


            <!-- LEARNING -->

            <div class="skill-item">

                <div class="skill-title">

                    <h2>
                        การเรียนรู้
                    </h2>

                    <span>
                        90%
                    </span>

                </div>


                <div class="skill-bar">

                    <div class="skill-progress learning"></div>

                </div>

            </div>


        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        © 2026 THANACHOT LULASUK

    </footer>


</body>

</html>
