<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Education | Thanachot</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080808;
            color: #ffffff;
            font-family: 'Kanit', sans-serif;
            overflow-x: hidden;
        }

        /* BACKGROUND EFFECTS */

        .wave {
            position: fixed;
            left: -20%;
            width: 140%;
            height: 300px;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.25;
        }

        .wave1 {
            top: 25%;
            border-top: 2px solid #e50914;
            box-shadow:
                0 -20px 0 rgba(229, 9, 20, 0.15),
                0 -40px 0 rgba(229, 9, 20, 0.08);
            animation: waveMove 8s ease-in-out infinite alternate;
        }

        .wave2 {
            top: 55%;
            border-top: 1px solid #ff1a25;
            opacity: 0.15;
            animation: waveMoveReverse 10s ease-in-out infinite alternate;
        }

        .red-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            top: 20%;
            right: -200px;
            background: #e50914;
            filter: blur(180px);
            opacity: 0.08;
            pointer-events: none;
            z-index: -2;
        }

        @keyframes waveMove {

            0% {
                transform: translateX(-5%) rotate(-3deg);
            }

            50% {
                transform: translateX(5%) rotate(3deg);
            }

            100% {
                transform: translateX(-3%) rotate(-2deg);
            }

        }

        @keyframes waveMoveReverse {

            0% {
                transform: translateX(5%) rotate(3deg);
            }

            50% {
                transform: translateX(-5%) rotate(-3deg);
            }

            100% {
                transform: translateX(3%) rotate(2deg);
            }

        }

        /* NAVBAR */

        header {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 25px 7%;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            letter-spacing: 3px;
        }

        .logo span {
            color: #e50914;
        }

        .menu {
            display: flex;
            gap: 28px;
        }

        .menu a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .menu a:hover,
        .menu a.active {
            color: #e50914;
        }

        /* PAGE TITLE */

        .page-title {
            text-align: center;
            margin-bottom: 80px;
        }

        .page-title p {
            color: #e50914;
            letter-spacing: 5px;
            font-size: 13px;
        }

        .page-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(40px, 6vw, 75px);
            letter-spacing: 5px;
            margin-top: 15px;
        }

        .page-title h1 span {
            color: transparent;
            -webkit-text-stroke: 1px #e50914;
        }

        /* EDUCATION */

        .education-page {
            min-height: 800px;
            padding: 80px 8%;
        }

        .education-timeline {
            max-width: 900px;
            margin: auto;
            position: relative;
        }

        .education-timeline::before {
            content: "";
            position: absolute;
            left: 35px;
            top: 0;
            width: 2px;
            height: 100%;
            background: #e50914;
            box-shadow: 0 0 15px #e50914;
        }

        .education-item {
            display: flex;
            gap: 40px;
            position: relative;
            margin-bottom: 45px;
        }

        .education-number {
            width: 72px;
            height: 72px;
            flex-shrink: 0;
            border: 2px solid #e50914;
            background: #080808;
            color: #e50914;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            position: relative;
            z-index: 2;
        }

        .education-content {
            flex: 1;
            padding: 28px 35px;
            background: #111;
            border: 1px solid #292929;
            transition: 0.4s;
        }

        .education-content:hover {
            transform: translateX(10px);
            border-color: #e50914;
            box-shadow: 0 0 25px rgba(229, 9, 20, 0.2);
        }

        .education-level {
            color: #e50914;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .education-content h2 {
            margin-top: 12px;
            font-size: 25px;
        }

        .school-name {
            color: #aaa;
            margin-top: 10px;
            font-size: 18px;
        }

        /* FOOTER */

        footer {
            padding: 30px;
            text-align: center;
            color: #666;
            border-top: 1px solid #222;
            font-size: 13px;
        }

        /* RESPONSIVE */

        @media (max-width: 900px) {

            .menu {
                gap: 12px;
            }

            .menu a {
                font-size: 11px;
            }

        }

        @media (max-width: 600px) {

            header {
                padding: 20px;
            }

            nav {
                flex-direction: column;
                gap: 20px;
            }

            .menu {
                flex-wrap: wrap;
                justify-content: center;
            }

            .education-page {
                padding: 60px 20px;
            }

            .education-timeline::before {
                left: 25px;
            }

            .education-item {
                gap: 20px;
            }

            .education-number {
                width: 52px;
                height: 52px;
                font-size: 11px;
            }

            .education-content {
                padding: 20px;
            }

            .education-content h2 {
                font-size: 19px;
            }

            .school-name {
                font-size: 15px;
            }

        }

    </style>

</head>

<body>

    <div class="wave wave1"></div>

    <div class="wave wave2"></div>

    <div class="red-glow"></div>


    <header>

        <nav>

            <h2 class="logo">
                DREAM<span>.</span>
            </h2>


            <div class="menu">

                <a href="index.html">

                </a>

                <a href="personal.html">

                </a>

                <a href="education.html" class="active">

                </a>

                <a href="activities.html">

                </a>

                <a href="skills.html">

                </a>

                <a href="contact.html">
                    CONTACT
                </a>

            </div>

        </nav>

    </header>


    <main class="education-page">


        <div class="page-title">

            <p>

            </p>

            <h1>
                EDUCA<span>TION</span>
            </h1>

        </div>


        <section class="education-timeline">


            <div class="education-item">

                <div class="education-number">

                <div class="education-content">

                    <p class="education-level">

                    </p>

                    <h2>
                        มัธยมศึกษาตอนต้น
                    </h2>

                    <p class="school-name">
                        โรงเรียนรสลินคัคณางค์
                    </p>

                </div>

            </div>


            <div class="education-item">

                <div class="education-number">
                    02
                </div>


                <div class="education-content">

                    <p class="education-level">

                    </p>

                    <h2>

                    </h2>

                    <p class="school-name">

                </div>

            </div>


            <div class="education-item">

                <div class="education-content">

                    </p>

                    </h2>

                    <p class="school-name">

                    </p>

                </div>

            </div>


        </section>

    </main>


    <footer>

        © 2026 THANACHOT LULASUK

    </footer>


</body>

</html>
